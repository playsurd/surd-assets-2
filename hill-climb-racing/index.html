<style>

<div id="stage"><canvas id="canvas" width="800" height="600" tabindex="0"></canvas></div>
<div id="hud"><span id="fps"></span><button id="bsound">Sound: on</button><button id="bfps" title="F8">FPS</button><button id="bcap" title="Frame rate cap">Cap: 60</button><button id="bvsync">Vsync: off</button><button id="bfull" title="F11">Fullscreen</button></div>
<div id="overlay"><div class="card">
  <div id="load-times" aria-live="polite">

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), status = s => { $('status').textContent = s; };
  const q = new URLSearchParams(location.search);
  // where hcr.data is served from: '' = next to this page, or a CDN folder URL ending in '/'
  // (`python build.py pack hcr` writes the game files into one hcr.data)
  const GAME_BASE = '';
  // settings saved before the port's rename (saVsync, saProgs) carry over once
  try { for (const k of ['Vsync', 'Progs']) { const v = localStorage.getItem('sa' + k); if (v !== null) { if (localStorage.getItem('hcr' + k) === null) localStorage.setItem('hcr' + k, v); localStorage.removeItem('sa' + k); } } } catch (e) {}
  const assetTimings = new Map();
  const timingIds = { 'hcr.wasm': 'wasm-time', 'hcr.data': 'data-time', 'image.bin': 'bin-time' };
  const recordTiming = entry => {
    const name = new URL(entry.name).pathname.split('/').pop();
    const id = timingIds[name];
    if (!id) return;
    const stat = assetTimings.get(name) || { ms: 0, requests: 0 };
    stat.ms += entry.duration;
    stat.requests++;
    assetTimings.set(name, stat);
    $(id).textContent = (stat.ms / 1000).toFixed(2) + ' s' + (stat.requests > 1 ? ` (${stat.requests} requests)` : '');
    $(id.replace('-time', '-bar')).classList.add('done');
  };
  new PerformanceObserver(list => list.getEntries().forEach(recordTiming))
    .observe({ type: 'resource', buffered: true });
  const supported = 'Suspending' in WebAssembly;
  if (!supported) status('This browser lacks WebAssembly JavaScript Promise Integration: use Chrome or Edge 137 or newer.');
  let GAME_W = 1280, GAME_H = 720;              // the game's back buffer (mouse coordinates are in it; follows its video mode)

  // physical key (KeyboardEvent.code) -> [virtual key, scan code, extended]
  const K = {};
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((ch, i) => { K['Key' + ch] = [65 + i, [0x1E,0x30,0x2E,0x20,0x12,0x21,0x22,0x23,0x17,0x24,0x25,0x26,0x32,0x31,0x18,0x19,0x10,0x13,0x1F,0x14,0x16,0x2F,0x11,0x2D,0x15,0x2C][i], 0]; });
  for (let d = 0; d <= 9; d++) K['Digit' + d] = [48 + d, d === 0 ? 0x0B : d + 1, 0];
  Object.assign(K, { Escape: [0x1B, 0x01, 0], Minus: [0xBD, 0x0C, 0], Equal: [0xBB, 0x0D, 0], Backspace: [0x08, 0x0E, 0], Tab: [0x09, 0x0F, 0], BracketLeft: [0xDB, 0x1A, 0], BracketRight: [0xDD, 0x1B, 0],
    Enter: [0x0D, 0x1C, 0], ControlLeft: [0x11, 0x1D, 0], Semicolon: [0xBA, 0x27, 0], Quote: [0xDE, 0x28, 0], Backquote: [0xC0, 0x29, 0], ShiftLeft: [0x10, 0x2A, 0], Backslash: [0xDC, 0x2B, 0],
    Comma: [0xBC, 0x33, 0], Period: [0xBE, 0x34, 0], Slash: [0xBF, 0x35, 0], ShiftRight: [0x10, 0x36, 0], NumpadMultiply: [0x6A, 0x37, 0], AltLeft: [0x12, 0x38, 0], Space: [0x20, 0x39, 0],
    CapsLock: [0x14, 0x3A, 0], F1: [0x70, 0x3B, 0], F2: [0x71, 0x3C, 0], F3: [0x72, 0x3D, 0], F4: [0x73, 0x3E, 0], F5: [0x74, 0x3F, 0], F6: [0x75, 0x40, 0], F7: [0x76, 0x41, 0], F10: [0x79, 0x44, 0],
    F12: [0x7B, 0x58, 0], Numpad7: [0x67, 0x47, 0], Numpad8: [0x68, 0x48, 0], Numpad9: [0x69, 0x49, 0], NumpadSubtract: [0x6D, 0x4A, 0], Numpad4: [0x64, 0x4B, 0], Numpad5: [0x65, 0x4C, 0],
    Numpad6: [0x66, 0x4D, 0], NumpadAdd: [0x6B, 0x4E, 0], Numpad1: [0x61, 0x4F, 0], Numpad2: [0x62, 0x50, 0], Numpad3: [0x63, 0x51, 0], Numpad0: [0x60, 0x52, 0], NumpadDecimal: [0x6E, 0x53, 0],
    NumpadEnter: [0x0D, 0x1C, 1], ControlRight: [0x11, 0x1D, 1], AltRight: [0x12, 0x38, 1], ArrowUp: [0x26, 0x48, 1], ArrowLeft: [0x25, 0x4B, 1], ArrowRight: [0x27, 0x4D, 1], ArrowDown: [0x28, 0x50, 1],
    Insert: [0x2D, 0x52, 1], Delete: [0x2E, 0x53, 1], Home: [0x24, 0x47, 1], End: [0x23, 0x4F, 1], PageUp: [0x21, 0x49, 1], PageDown: [0x22, 0x51, 1] });

  let M = null, started = false;
  // the canvas holds exactly the game's frame (it draws with a GAME_W x GAME_H viewport into the default framebuffer);
  // CSS stretches it over the whole window, and pointer positions are scaled back (pos)
  let transferred = false;
  const fit = () => { const w = GAME_W, h = GAME_H;
    if (M) { M.canvasW = w; M.canvasH = h; } if (!transferred && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; } };
  addEventListener('resize', fit); fit();
  $('bfps').onclick = () => { const f = $('fps'); f.style.display = f.style.display === 'inline' ? 'none' : 'inline'; };
  $('bfull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
  const setVsync = on => { if (M) M.vsync = on; localStorage.setItem('hcrVsync', on ? '1' : '0'); $('bvsync').textContent = 'Vsync: ' + (on ? 'on' : 'off'); };
  $('bvsync').onclick = () => { setVsync(localStorage.getItem('hcrVsync') !== '1'); alert('Reload the page to apply.'); };
  setVsync(localStorage.getItem('hcrVsync') === '1');
  // frame-rate cap (the game renders as fast as it is let; its animation follows the frame time)
  const CAPS = [60, 120, 0, 30], capName = c => c ? String(c) : 'max';
  let cap = +(q.get('HCR_FPS') ?? localStorage.getItem('hcrCap') ?? 60); if (!CAPS.includes(cap)) cap = 60;
  const showCap = () => { $('bcap').textContent = 'Cap: ' + capName(cap); };
  $('bcap').onclick = () => { cap = CAPS[(CAPS.indexOf(cap) + 1) % CAPS.length]; localStorage.setItem('hcrCap', String(cap)); showCap(); if (M && M._hcr_ev_fps) M._hcr_ev_fps(cap); };
  showCap();
  for (const b of document.querySelectorAll('#hud button')) { b.tabIndex = -1; b.addEventListener('mousedown', e => e.preventDefault()); b.addEventListener('click', () => { b.blur(); canvas.focus(); }); }

  // ---- input -> guest window messages / DirectInput state
  const ev = (name, ...a) => { if (M && M['_' + name]) M['_' + name](...a); };

  const pos = e => { const r = canvas.getBoundingClientRect();
    const scale = Math.min(r.width / GAME_W, r.height / GAME_H);
    const cw = GAME_W * scale, ch = GAME_H * scale;
    const ox = r.left + (r.width - cw) / 2, oy = r.top + (r.height - ch) / 2;

    if (!started) return;
    if (e.code === 'F8') { $('bfps').onclick(); e.preventDefault(); return; }
    if (e.code === 'F11') { $('bfull').onclick(); e.preventDefault(); return; }
    const k = K[e.code]; if (!k) return;
    ev('hcr_ev_key', 1, k[0], k[1], (e.repeat ? 1 : 0) | (k[2] ? 2 : 0));
    if (e.key.length === 1 && !e.ctrlKey && !e.altKey) ev('hcr_ev_char', e.key.charCodeAt(0));
    else if (e.code === 'Enter' || e.code === 'Backspace' || e.code === 'Escape') ev('hcr_ev_char', k[0]);
    e.preventDefault();
  });
  addEventListener('keyup', e => { if (!started) return; const k = K[e.code]; if (!k) return; ev('hcr_ev_key', 0, k[0], k[1], k[2] ? 2 : 0); e.preventDefault(); });

  // with another)
  let mouseDown = false;
  const tid = e => (e.pointerId % 1000000) + 2;
  canvas.addEventListener('pointerdown', e => {
    canvas.focus(); e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
    const [x, y] = pos(e);
    if (e.pointerType === 'mouse') { mouseDown = true; ev('hcr_ev_mouse', 0, x, y, 0, 0); ev('hcr_ev_mouse', 1, x, y, e.button, 0); }
    else ev('hcr_ev_touch', 0, tid(e), x, y);
  });
  canvas.addEventListener('pointermove', e => {
    const [x, y] = pos(e);
    if (e.pointerType === 'mouse') ev('hcr_ev_mouse', 0, x, y, 0, 0); else ev('hcr_ev_touch', 1, tid(e), x, y);
  });
  const up = e => {
    const [x, y] = pos(e);
    if (e.pointerType === 'mouse') { if (mouseDown) { mouseDown = false; ev('hcr_ev_mouse', 2, x, y, e.button, 0); } }
    else ev('hcr_ev_touch', 2, tid(e), x, y);
  };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('focus', () => ev('hcr_ev_focus', 1)); addEventListener('blur', () => ev('hcr_ev_focus', 0));
  canvas.addEventListener('webglcontextlost', () => { status('The graphics context was lost (GPU reset). Reload the page to continue.'); $('overlay').classList.remove('hidden'); });

  // ---- audio: an AudioWorklet playing the DirectSound mix (jitter buffer; drops backlog beyond 200 ms)
  const WORKLET = `class HCROut extends AudioWorkletProcessor {
    constructor() { super(); this.q = []; this.off = 0; this.queued = 0;
      this.port.onmessage = e => { this.q.push(e.data); this.queued += e.data.length / 2;
        while (this.queued > sampleRate * 0.2 && this.q.length > 1) { const b = this.q.shift(); this.queued -= b.length / 2 - this.off; this.off = 0; } }; }
    process(inputs, outputs) { const out = outputs[0], L = out[0], R = out[1] || out[0], n = L.length; let i = 0;
      while (i < n && this.q.length) { const b = this.q[0], frames = b.length / 2, take = Math.min(n - i, frames - this.off);
        for (let k = 0; k < take; k++) { L[i + k] = b[(this.off + k) * 2]; R[i + k] = b[(this.off + k) * 2 + 1]; }
        i += take; this.off += take; this.queued -= take; if (this.off >= frames) { this.q.shift(); this.off = 0; } }
      for (; i < n; i++) { L[i] = 0; R[i] = 0; }
      return true; } }

  async function startAudio(M) {
    try {
      const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
      const node = new AudioWorkletNode(ctx, 'hcr-out', { numberOfInputs: 0, outputChannelCount: [2] });
      node.connect(ctx.destination); M.audioContext = ctx; M.audioNode = node;
      const resumeAudio = () => { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); };
      addEventListener('pointerdown', resumeAudio, { once: true });
      addEventListener('keydown', resumeAudio, { once: true });
      $('bsound').onclick = () => { const on = ctx.state !== 'running'; if (on) ctx.resume(); else ctx.suspend(); $('bsound').textContent = on ? 'Sound: on' : 'Sound: off'; };
    } catch (e) { console.warn('[audio] unavailable:', e); $('bsound').textContent = 'Sound: n/a'; }
  }

  async function startGame() {
    if (started) return; started = true;
    status('Loading…');
    M = {
      canvas, vsync: localStorage.getItem('hcrVsync') === '1' || q.has('vsync'),
      preRun: [m => { m.ENV.HCR_FPS = String(cap); for (const [k, v] of q) if (k.startsWith('HCR_')) m.ENV[k] = v; }],   // debug switches, e.g. ?HCR_INPUT=...
      print: s => console.log(s), printErr: s => console.error(s),
      onStatus: s => status(s),
      onFps: f => { $('fps').textContent = f.toFixed(0) + ' fps'; },
      onGameSize: (w, h) => { GAME_W = w; GAME_H = h; fit(); },

    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => console.log('[web] persistent storage: ' + ok)); } catch (e) {}

    // programs.txt is served as text/plain; the site used to redirect unknown extensions to /404,
    // and fetch() follows that redirect, so without these guards the 404 HTML page was ingested
    // as a program list and compiled as garbage (one extra /404 fetch + bogus recompiles in hill.log).
    M.gameBase = GAME_BASE;
    let bundledProgs = '';
    try {
      const r = await fetch('programs.txt');
      const urlOk = (() => { try { return new URL(r.url, location.href).pathname.endsWith('programs.txt'); } catch (e) { return true; } })();
      const type = (r.headers.get('content-type') || '').toLowerCase();
      if (r.ok && urlOk && (type.includes('text/plain') || type.includes('text/') || type === '' || type.includes('octet-stream'))) {
        const t = await r.text();
        // real lists are "hash per line"; a redirected 404 page is HTML
        if (!/<(!doctype|html)/i.test(t.slice(0, 512))) bundledProgs = t;
      }

    await startAudio(M);                    // audio resumes on the first user gesture
    HCRWasm(M).then(() => {
      // the cap button only calls _hcr_ev_fps on click; apply the stored cap on boot too,
      // otherwise the first session runs uncapped until the user touches the button.
      try { if (M._hcr_ev_fps) M._hcr_ev_fps(cap); } catch (e) {}
    }).catch(e => { status('Failed to start: ' + e); console.error(e); });
    canvas.focus();
  }
  if (supported) startGame();
})();
</script>
